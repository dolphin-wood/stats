name: Generate Stats Images

on:
  push:
    branches: [ master ]
  schedule:
    # Off the top of the hour: scheduled runs at :00 are delayed for hours
    # because of load on GitHub's side.
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Push and scheduled runs both push to the `generated` branch; run them one at
# a time so the second one does not fail on a non-fast-forward push.
concurrency:
  group: generate-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: pip

    - name: Install requirements
      run: python3 -m pip install -r requirements.txt

    - name: Generate images
      run: |
        python3 --version
        python3 generate_images.py
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        EXCLUDED: ${{ secrets.EXCLUDED }}
        EXCLUDED_LANGS: ${{ secrets.EXCLUDED_LANGS }}
        EXCLUDE_FORKED_REPOS: true

    - name: Commit to the repo
      run: ./commit.sh
      env:
        SCHEDULED_ACTION: ${{ github.event_name == 'schedule' && 'true' || '' }}
